# Personal website: Jiayang Wang
locale: "en-US"
title: "Jiayang Wang"
title_separator: "|"
name: "Jiayang Wang"
description: "Jiayang Wang is a Ph.D. candidate in Statistics at the University of Wisconsin–Madison, working on statistical methods for phylogenetic trees and networks."
url: "https://jiayangwang0612.github.io"
baseurl: ""
repository: "JiayangWang0612/JiayangWang0612.github.io"
timezone: "America/Chicago"

author:
  avatar: "Jiayang.png"
  name: "Jiayang Wang"
  pronouns: "He/Him/His"
  bio: "Ph.D. candidate in Statistics"
  location: "Madison, WI"
  employer: "University of Wisconsin–Madison"
  email: "jwang2657@wisc.edu"
  github: "JiayangWang0612"

breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
atom_feed:
  hide: true
comments:
  provider: false
analytics:
  provider: false

# Source files and development tools should not become public pages.
include:
  - _pages
exclude:
  - README.md
  - UPDATE_GUIDE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - .github
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .DS_Store
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
